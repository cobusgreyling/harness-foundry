  <rect width="1200" height="400" fill="url(#bg)"/>
  <text x="80" y="170" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="64" font-weight="700">harness-foundry</text>
  <text x="80" y="230" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28">Composable runtime between model and reliable behaviour</text>
  <rect x="80" y="270" width="180" height="44" rx="8" fill="url(#accent)" opacity="0.9"/>
