  <rect x="280" y="270" width="200" height="44" rx="8" fill="#334155"/>
  <text x="305" y="299" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="18">primitives → trace</text>
  <rect x="500" y="270" width="220" height="44" rx="8" fill="#334155"/>
  <text x="525" y="299" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="18">foundry run → evolve</text>
