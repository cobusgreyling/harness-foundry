name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint

      - name: Verify npm publish credentials
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN not set — release will version only, not publish"
            exit 0
          fi
          npm whoami
          echo "::notice::NPM_TOKEN must be a Classic Automation token (bypasses 2FA). Granular publish tokens fail with EOTP in CI."

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version:ci
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ env.NPM_TOKEN }}